name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Run the navigation demo (smoke test)
        run: python demo.py

      - name: Run the planner and inflation demo (smoke test)
        run: python planners_demo.py

      - name: Run a quick benchmark (smoke test)
        run: python benchmark.py --quick
